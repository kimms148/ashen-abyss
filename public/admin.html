<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>잿빛 심연 관리자</title>
<style>
:root{--bg:#0e0b12;--panel:#17131d;--panel2:#1f1a27;--line:#33293d;--ink:#efe6d4;--dim:#9a8f80;--gold:#d9ae5c;--red:#ff6a5a;--green:#8fd18f;--r:8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
h1,h2{font-family:"Song Myung","Batang",serif;font-weight:400;margin:0}
h1{font-size:26px;color:var(--gold)}h2{font-size:18px;color:var(--gold);margin-bottom:10px}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:14px}
.sub{color:var(--dim);font-size:13px;margin:4px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
textarea,input,select{width:100%;background:#120e18;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;font-size:13px}
textarea{resize:vertical;min-height:70px;font-family:ui-monospace,Consolas,monospace;font-size:11px}
button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
button:hover{border-color:var(--gold)}button.pri{background:#3a2c14;border-color:var(--gold);color:#ffe7a8}
button.del{color:var(--red)}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.row>*{flex:1 1 auto}.row>button{flex:0 0 auto}
.tools{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}.tools input{flex:1 1 200px;width:auto}.tools select{flex:0 0 160px;width:auto}
.cards{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.card .nm{font-size:18px}.card .nm small{color:var(--dim);font-size:13px;margin-left:6px}
.meta{color:var(--dim);font-size:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;margin:10px 0 4px;font-size:13px}
.kv div span{color:var(--dim);margin-right:6px}
.gear{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 14px;font-size:13px;margin:6px 0}
.gear div span{color:var(--dim);margin-right:6px}.aw{color:var(--gold)}
.empty{color:var(--dim);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:var(--r)}
.gifts{margin-top:10px;font-size:12px;max-height:260px;overflow:auto}
.gifts div{border-top:1px solid var(--line);padding:6px 0;display:flex;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2133;border:1px solid var(--gold);border-radius:6px;padding:8px 16px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
label{font-size:12px;color:var(--dim);display:block;margin-top:8px}
.side{display:grid;gap:18px;position:sticky;top:12px}
@media(max-width:900px){.side{position:static}}
</style></head><body>
<div class="wrap">
<header><div><h1>잿빛 심연 관리자</h1></div><div class="meta" id="count"></div></header>
<div class="grid">
<main>
  <div class="box" id="netBox" hidden style="margin-bottom:18px"><h2>서버 연결</h2>
    <div class="row"><input id="akey" type="password" placeholder="관리자 비밀번호"><button class="pri" id="bKey">연결</button></div><p class="sub" id="netMsg"></p></div>
  <div class="box"><h2>보고 코드 등록</h2>
    <textarea id="inCode" placeholder="R1.으로 시작하는 보고 코드"></textarea>
    <div class="row"><button class="pri" id="bAdd">등록</button><button id="bFile">파일에서 불러오기</button><input type="file" id="fIn" accept=".txt,.json,text/plain" multiple hidden></div></div>
  <div class="tools"><input id="q" placeholder="이름 검색"><select id="sort"><option value="lv">레벨 높은 순</option><option value="t">최근 보고 순</option><option value="name">이름 순</option><option value="fin">최종 보스 많은 순</option></select></div>
  <div class="cards" id="cards"></div>
</main>
<aside class="side">
  <div class="box"><h2>선물 만들기</h2>
    <label for="gTo">받는 사람</label><select id="gTo"></select>
    <label for="gKind">종류</label><select id="gKind"><option value="item">아이템 · 장비</option><option value="gold">골드</option></select>
    <div id="gItemW"><label for="gItem">아이템 이름</label><input id="gItem" list="itemList" placeholder="예: 최상급 물약">
      <div class="row"><div><label for="gN">개수</label><input id="gN" type="number" min="1" max="9999" value="1"></div><div id="gEW"><label for="gE">강화 (장비)</label><select id="gE"></select></div></div></div>
    <div id="gGoldW" hidden><label for="gGold">골드</label><input id="gGold" type="number" min="1" value="10000"></div>
    <div class="row"><button class="pri" id="bGift">선물 코드 만들기</button></div>
    <div id="gOutW" hidden><label for="gOut">선물 코드 · 받는 사람에게 보내 주세요</label><textarea id="gOut" readonly></textarea><div class="row"><button id="bGCopy">코드 복사</button></div></div>
    
    <div class="gifts" id="gifts"></div></div>
  <div class="box"><h2>명단 백업</h2>
    <div class="row"><button id="bExp">백업 파일 받기</button><button id="bImp">백업 불러오기</button><input type="file" id="fImp" accept=".json" hidden></div></div>
</aside>
</div></div>
<datalist id="itemList"></datalist>
<div class="toast" id="toast"></div>

  if(!j.admin)$('netMsg').textContent='서버에 ADMIN_KEY가 아직 없어요. Render 환경 변수에 넣어 주세요.';ON.key=load(KEY+'_akey','')||'';if(ON.key){$('akey').value='';pull();}setInterval(pull,20000);}catch(e){}})();
function readCode(txt,pre){const m=txt.match(new RegExp('^'+pre+'\\.([A-Za-z0-9_-]+)\\.([0-9a-z]+)$'));if(!m||chk(m[1])!==m[2])return null;try{return b64d(m[1]);}catch(e){return null;}}
function addCodes(text){const parts=(text||'').split(/\s+/).filter(Boolean);let ok=0,bad=0,old=0;
  for(const p of parts){const o=readCode(p,'R1');if(!o||!o.pid){bad++;continue;}if(L[o.pid]&&(L[o.pid].t||0)>(o.t||0)){old++;continue;}L[o.pid]=o;ok++;}
  store(ADM,L);render();toast(ok?`${ok}명 등록했어요${old?` · 예전 보고 ${old}개는 건너뜀`:''}${bad?` · 잘못된 코드 ${bad}개`:''}`:bad?'올바른 보고 코드가 아니에요':'이미 더 최근 보고가 있어요');}
const ptime=ms=>{const m=Math.floor((ms||0)/60000),h=Math.floor(m/60);return h?`${h}시간 ${m%60}분`:`${m}분`;};
const ago=t=>{if(!t)return '';const m=Math.round((Date.now()-t)/60000);const d=new Date(t);const at=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;return (m<1?'방금':m<60?`${m}분 전`:m<1440?`${Math.round(m/60)}시간 전`:`${Math.round(m/1440)}일 전`)+` (${at})`;};
const gearTxt=x=>x?`${esc(x.n)}${x.e?' +'+x.e:''}${x.aw?' <span class="aw">각성</span>':''}`:'<span class="meta">없음</span>';
function render(){const q=$('q').value.trim().toLowerCase(),s=$('sort').value;let A=Object.values(L);
  $('count').textContent=`참여자 ${A.length}명`;
  if(q)A=A.filter(v=>(v.name||'').toLowerCase().includes(q));
  A.sort((a,b)=>s==='name'?(a.name||'').localeCompare(b.name||''):s==='t'?(b.t||0)-(a.t||0):s==='fin'?(b.fin||0)-(a.fin||0)||(b.lv||0)-(a.lv||0):(b.lv||0)-(a.lv||0));
  $('cards').innerHTML=A.length?A.map(v=>`<div class="card"><div class="top"><div class="nm">${esc(v.name)}<small>Lv ${v.lv} · ${esc(v.title)}</small></div><div class="meta">${v.net?'자동 보고':'코드 보고'} ${ago(v.t)}</div></div>
    <div class="kv"><div><span>현재 위치</span>${esc(v.town||'-')}</div><div><span>마지막 보스</span>${esc(v.lastBoss)}</div><div><span>최종 보스</span>${v.fin||0} / 9</div>
      <div><span>공격</span>${v.atk} <span>방어</span>${v.def} <span>체력</span>${v.hp}</div><div><span>골드</span>${Number(v.gold||0).toLocaleString()}G</div><div><span>플레이</span>${ptime(v.playMs)} <span>사망</span>${v.deaths||0}번</div>
      ${v.st?`<div><span>스탯</span>${Object.entries(v.st).map(([k,x])=>esc(STN[k]||k)+' '+x).join(' · ')}</div>`:''}</div>
    <div class="gear"><div><span>무기</span>${gearTxt(v.gear&&v.gear.w)}</div><div><span>방어구</span>${gearTxt(v.gear&&v.gear.a)}</div><div><span>방패</span>${gearTxt(v.gear&&v.gear.s)}</div><div><span>망토</span>${gearTxt(v.gear&&v.gear.c)}</div></div>
    <div class="row"><button data-a="save" data-p="${esc(v.pid)}" ${v.save?'':'disabled'}>진행 저장</button><button data-a="gift" data-p="${esc(v.pid)}">선물 주기</button><button class="del" data-a="del" data-p="${esc(v.pid)}">명단에서 지우기</button></div></div>`).join('')
    :`<div class="empty">${Object.keys(L).length?'검색 결과가 없어요':'아직 참여자가 없어요.'}</div>`;
  const cur=$('gTo').value;$('gTo').innerHTML=Object.values(L).sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(v=>`<option value="${esc(v.pid)}">${esc(v.name)} (Lv ${v.lv})</option>`).join('')||'<option value="">참여자를 먼저 등록하세요</option>';
  if(cur&&L[cur])$('gTo').value=cur;renderGifts();}
function renderGifts(){const nm=pid=>(L[pid]&&L[pid].name)||'?';const A=ON.key&&ON.codes.length?ON.codes.map(c=>({toName:nm(c.to),what:c.what,t:c.t,code:c.code,used:c.used})):G.slice(-30).reverse();
  $('gifts').innerHTML=A.map(g=>`<div><span>${esc(g.toName)} · ${esc(g.what)}${g.code?`<br><span class="meta" style="font-family:monospace">${esc(g.code)}</span>`:''}</span><span class="meta">${g.used?'<span style="color:var(--green)">받음</span>':g.code?'안 받음':''} ${ago(g.t).split(' (')[0]}</span></div>`).join('');}
function saveFile(name,data){const bl=new Blob([data],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
$('cards').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const v=L[b.dataset.p];if(!v)return;
  if(b.dataset.a==='save'){const code=btoa(unescape(encodeURIComponent(JSON.stringify(v.save))));saveFile(`잿빛심연_${v.name}_Lv${v.lv}.txt`,code);toast('저장 파일을 받았어요 · 게임의 저장 관리에서 불러올 수 있어요');}
  else if(b.dataset.a==='gift'){$('gTo').value=v.pid;$('gItem').focus();window.scrollTo({top:0,behavior:'smooth'});}
  else if(b.dataset.a==='del'){if(confirm(`${v.name}을(를) 명단에서 지울까요?`)){if(v.net&&ON.key)fetch('/api/admin/delete',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':ON.key},body:JSON.stringify({pid:v.pid})});delete L[v.pid];store(ADM,L);render();}}});
$('bKey').onclick=()=>{ON.key=$('akey').value.trim();store(KEY+'_akey',ON.key);$('akey').value='';pull();};
$('bAdd').onclick=()=>{addCodes($('inCode').value);$('inCode').value='';};
$('bFile').onclick=()=>$('fIn').click();
$('fIn').onchange=async()=>{let t='';for(const f of $('fIn').files)t+=' '+await f.text();addCodes(t);$('fIn').value='';};
$('q').oninput=render;$('sort').onchange=render;
$('itemList').innerHTML=ITEMS.map(([k,n,c,f])=>`<option value="${esc(n)} · ${esc(c)}${f?' · 최종보스':''}"></option>`).join('');
$('gE').innerHTML=Array.from({length:10},(_,i)=>`<option value="${i}">+${i}</option>`).join('');
const gearSlots=new Set(['무기','방어구','방패','망토','장비']);
function pickItem(){const v=$('gItem').value.trim();if(!v)return null;const [nm,cat]=v.split(' · ');let c=ITEMS.filter(x=>x[1]===nm&&(!cat||x[2]===cat));if(!c.length){const n=v.replace(/\s+/g,'');c=ITEMS.filter(x=>x[1].replace(/\s+/g,'')===n);if(!c.length)c=ITEMS.filter(x=>x[1].replace(/\s+/g,'').includes(n));}return c[0]||null;}
$('gItem').oninput=()=>{const it=pickItem();$('gEW').style.visibility=it&&gearSlots.has(it[2])?'visible':'hidden';};
$('gKind').onchange=()=>{const g=$('gKind').value==='gold';$('gItemW').hidden=g;$('gGoldW').hidden=!g;};
$('bGift').onclick=async()=>{const v=L[$('gTo').value];if(!v){toast('받는 사람을 고르세요');return;}
  const g={gid:Math.random().toString(36).slice(2,10)+Date.now().toString(36),to:v.pid,uid:v.uid||null,t:Date.now()};let what='';
  if($('gKind').value==='gold'){const n=Math.floor(+$('gGold').value);if(!(n>0)){toast('골드를 적어 주세요');return;}g.gold=n;what=n.toLocaleString()+'G';}
  else{const it=pickItem();if(!it){toast('없는 아이템이에요');return;}const n=Math.max(1,Math.min(9999,Math.floor(+$('gN').value)||1));g.k=it[0];g.n=n;const isG=gearSlots.has(it[2]);if(isG){const e=+$('gE').value;if(e)g.e=e;}what=`${it[1]}${isG&&g.e?' +'+g.e:''}${n>1?' ×'+n:''}`;}
  $('gOutW').hidden=false;$('gOut').value='만드는 중…';
  if(v.net&&ON.key){try{const r=await fetch('/api/admin/gift',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':ON.key},body:JSON.stringify({gift:g,what})});const j=await r.json();
      if(j&&j.code){$('gOut').value=j.code;toast(`${v.name}에게 줄 선물 코드를 만들었어요`);pull();return;}}catch(e){}
    $('gOut').value='';toast('서버에서 코드를 만들지 못했어요');return;}
  const b=b64e(g);$('gOut').value='G2.'+b+'.'+await hmac24(b);G.push({toName:v.name,what,t:g.t,gid:g.gid});if(G.length>200)G=G.slice(-200);store(GKEY,G);renderGifts();toast(`${v.name}에게 줄 선물 코드를 만들었어요`);};
$('bGCopy').onclick=()=>{const t=$('gOut');t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value);toast('복사했어요');};
$('bExp').onclick=()=>{const d=new Date();saveFile(`잿빛심연_관리자명단_${d.getMonth()+1}${String(d.getDate()).padStart(2,'0')}.json`,JSON.stringify({v:1,players:L,gifts:G}));};
$('bImp').onclick=()=>$('fImp').click();
$('fImp').onchange=async()=>{const f=$('fImp').files[0];if(!f)return;try{const o=JSON.parse(await f.text());let n=0;for(const k in (o.players||{})){const v=o.players[k];if(!L[k]||(L[k].t||0)<(v.t||0)){L[k]=v;n++;}}if(Array.isArray(o.gifts))G=G.concat(o.gifts.filter(x=>!G.some(y=>y.gid===x.gid)));store(ADM,L);store(GKEY,G);render();toast(`${n}명을 불러왔어요`);}catch(e){toast('백업 파일이 올바르지 않아요');}$('fImp').value='';};
addEventListener('storage',e=>{if(e.key===ADM){L=load(ADM,{});render();}});
render();
</script></body></html>
