<style>

.pots button{font-size:13px}

#party{position:fixed;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:4px;pointer-events:none;width:150px}#party .pm{display:flex;gap:5px;align-items:center;background:rgba(11,9,16,.72);border:1px solid #2a2434;border-radius:4px;padding:3px 5px}#party .pm img{width:26px;height:26px;image-rendering:pixelated;flex:none}#party .pm div{flex:1;min-width:0}#party .pm b{display:block;font-size:10px;font-weight:400;color:#f0e6d0;white-space:normal;word-break:keep-all;line-height:1.15}#party .hb{position:relative;height:5px;background:#3a1216;border-radius:1px;margin-top:2px;overflow:hidden}#party .hb i{position:absolute;inset:0 auto 0 0;background:#5ad06a}#party .pm.dead{opacity:.75}#party .pm.dead img{filter:grayscale(1) brightness(.6)}#party .pm small{display:block;font-size:9.5px;color:#ff9a8a;line-height:1.2}#party .pm .st{display:block;font-size:9px;color:#9a8fb0}body.land #party{width:118px}body.land #party .pm img{width:20px;height:20px}

.islot.gear{border-color:#8a6a2a}

.item small{color:var(--dim);font-size:12px}

.joy{position:relative;width:140px;height:140px;flex:none;border-radius:50%;background:radial-gradient(circle,#1d1926 0,#15121b 70%);border:1px solid var(--line);touch-action:none}

.acts{display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto;gap:10px;align-items:end}
.acts .bag{grid-column:1}.acts .th{grid-column:2;grid-row:1}.acts .th2{grid-column:3;grid-row:1}.acts .atk{grid-column:2/4;grid-row:2/4;justify-self:center;width:96px;height:96px;border-radius:50%;font-family:var(--display);font-size:22px;background:#3a1c1a;border-color:#a8483e;color:#ffd9cf}

.acts .bag{width:64px;height:64px;border-radius:50%;font-size:14px}
.acts .aw3{grid-column:2;grid-row:4;background:#2a1c3a;border-color:#8a5ac8}.acts .aw4{grid-column:3;grid-row:4;background:#2a1c3a;border-color:#8a5ac8}.acts .aw{grid-column:1;grid-row:3}.acts .aw2{grid-column:4;grid-row:3;background:#2a1c3a;border-color:#8a5ac8}
.acts{grid-template-columns:auto auto auto auto}.acts .th3{grid-column:4;grid-row:1}.acts .ult{grid-column:4;grid-row:2;background:#3a2a10;border-color:#d9ae5c;color:#ffe08a}
@media (max-width:420px){.dpad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,52px)}.acts{gap:8px}.acts .atk{width:82px;height:82px}.acts .bag{width:54px;height:54px}}
.keys{font-size:12px;color:var(--dim);display:none}
body.desk .pad{display:none}
body.desk .keys{display:block}

html:has(body.desk){overflow:hidden}

body.desk .wrap{height:100%;gap:6px;max-width:min(1760px,100%)}

body.desk #log{min-height:0;height:3.1em;overflow:hidden;justify-content:flex-end;font-size:13px}

.qline{font-size:13px;color:#cfe6ff}
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start}
.hudl{display:grid;gap:5px;min-width:0}
.hudr{display:flex;flex-direction:column;gap:6px;align-items:stretch}

.pinfo{display:flex;flex-direction:column;gap:1px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

.islot.colno img{filter:brightness(0) opacity(.45)}.islot.colno .c{right:auto;left:50%;transform:translateX(-50%);top:50%;bottom:auto;transform:translate(-50%,-50%);color:#8a8098;font-size:14px}
.skrow{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.skb.awk{border-color:#5a3a8a}.skb.awk span{color:#e0c8ff}.skb.awk small{color:#c080ff}
.skb{position:relative;width:72px;height:38px;background:#15121b;border:1px solid #2e2838;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 3px;color:var(--text);font-size:11px;line-height:1.1}

.stat2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;color:var(--dim);padding:10px;background:#15121b;border:1px solid var(--line);border-radius:4px}

function heroDef(wi,ai){
  const A=ARMOR_LOOK[ai],Wp=WEAPON_LOOK[wi];
  const widen=r=>'..'+r.padEnd(16,'.').slice(0,16)+'......';
  const put=(rows,x,y,ch)=>{rows[y]=rows[y].slice(0,x+2)+ch+rows[y].slice(x+3);};
  const base=A.rows.map(widen);
  put(base,13,9,'G');if(Wp.cross)put(base,14,9,'G');
  for(let i=0;i<Wp.L;i++)put(base,13,10+i,i===Wp.L-1?'w':'W');
  const walk=base.slice();for(const k in A.legs.walk)walk[k]=widen(A.legs.walk[k]);
  const atk=A.rows.map(widen);for(const k in A.legs.atk)atk[k]=widen(A.legs.atk[k]);
  put(atk,12,9,'.');put(atk,12,8,'h');put(atk,13,8,'h');put(atk,14,8,'G');
  if(Wp.cross){put(atk,14,7,'G');put(atk,14,9,'G');}
  for(let i=0;i<Wp.La;i++)put(atk,15+i,8,i===Wp.La-1?'w':'W');
  const o=a=>Object.fromEntries(a.map((r,i)=>[i,r]));
  return {w:24,ox:2,rows:base,walk:o(walk),atk:o(atk),pal:{...A.pal,...Wp.pal},crop:[5,0]};
}

function rawFrame(rows,pal){
  const W=Math.max(...rows.map(r=>r.length)),H=rows.length,grid=rows.map(r=>r.padEnd(W,'.'));
  const c=mkCanvas(W,H),g=c.getContext('2d');
  const op=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&grid[y][x]!=='.'&&!!pal[grid[y][x]];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!op(x,y))continue;let col=pal[grid[y][x]];
    if(!op(x,y-1))col=shade(col,.14);else if(!op(x,y+1)||!op(x+1,y))col=shade(col,-.2);
    g.fillStyle=col;g.fillRect(x,y,1,1);}
  return c;
}

function armorTpl(k){if(ATPL[k])return ATPL[k];const g=GEAR[k];if(!g)return null;

    if(head==='great'||head==='open'){const c=bit(2,5);for(let x=0;x<16;x++)if(r[0][x]==='P')put(x,0,'.');
      if(c===1){if(mid){put(5,0,'P');put(6,0,'P');put(4,0,'P');}else{put(6,0,'P');put(7,0,'P');put(8,0,'P');}}
      else if(c===2){if(mid){put(3,1,'T');put(2,0,'T');}else{put(3,1,'T');put(2,0,'T');put(12,1,'T');put(13,0,'T');}}
      else if(c===3){if(mid)[3,5,7].forEach(x=>put(x,0,'T'));else [4,6,9,11].forEach(x=>put(x,0,'T'));}
      else if(c===4){if(mid){put(4,0,'T');put(5,0,'T');put(6,0,'T');}else for(let x=5;x<=10;x++)put(x,0,'T');}
      if(bit(3,2)&&head==='great'&&view!=='back'){rep(5,'V','T');}}
    if(head==='hood'){const c=bit(2,3);if(c===1){rep(0,'B','.');}else if(c===2&&view==='front'){put(7,3,'T');put(8,3,'T');}else if(c===0&&!mid){put(7,0,'T');}}
    if(head==='hair'){const c=bit(2,3);if(c===1){rep(1,'R','N');rep(2,'R','N');}else if(c===2){rep(3,'R','T');}}

    // chest emblem (front only)
    if(view==='front'){const e=bit(5,5);for(let y=9;y<=11;y++)for(let x=5;x<=10;x++)if(r[y][x]==='Y')put(x,y,'B');
      if(torso!=='cloak'||true){

        else if(e===2){put(6,9,'Y');put(9,9,'Y');put(7,10,'Y');put(8,10,'Y');}
        else if(e===3){put(7,10,'T');put(8,10,'T');put(6,9,'Y');put(9,9,'Y');put(6,11,'Y');put(9,11,'Y');}}}
    // belt buckle

      const mn=bit(11,3);if(mn===1){r[t0]=r[t0].replace(/B/g,'T');}else if(mn===2&&!mid){put(1,t0+2,'T');put(14,t0+2,'T');put(2,t0+1,'T');put(13,t0+1,'T');}
      const sl=bit(12,3);if(sl===1){r[t0+2]=r[t0+2].replace(/b/g,'T');}else if(sl===2&&view==='front'){for(let y=t0+1;y<L;y++)if(r[y][7]==='B'||r[y][7]==='b'||r[y][7]==='Y')put(7,y,'N');}}

}

function pFloor(P,R,th){
  const t=TH[th];P.r(0,0,16,16,t.mortar);
  for(const y of [0,8]){let x=-(R()*6|0);while(x<16){const w=5+(R()*6|0);slab(P,x,y,w-1,7,pick(R,t.floors));x+=w;}}

  for(let i=0;i<7;i++)P.p(R()*16|0,R()*16|0,pick(R,t.speck));
  if(t.acc&&R()<.35){const x=1+(R()*12|0),y=1+(R()*12|0);
    if(th==='t2'){P.p(x,y,t.acc[0]);P.p(x+1,y,t.acc[1]);P.p(x,y+1,t.acc[0]);P.p(x+2,y+1,t.acc[0]);}
    else{P.p(x,y,t.acc[1]);P.p(x,y+1,t.acc[0]);P.p(x+1,y+1,t.acc[0]);P.p(x-1,y+1,shade(t.acc[0],-.3));}}
}

const wG=()=>GEAR[S.p.wgear],aG=()=>GEAR[S.p.agear],sG=()=>GEAR[S.p.sgear],cG=()=>GEAR[S.p.cgear];
const robeA=()=>{const g=aG();return g&&ok(g,'a')?(g.aspd||0):0;},robeC=()=>{const g=aG();return g&&ok(g,'a')?(g.cdr||0):0;};
const noDur=g=>!!(g&&g.slot==='a'&&/로브/.test(g.name));
const maxDur=g=>!g?0:noDur(g)?9999:Math.round((60+Math.sqrt(g.buy||g.price*2||40)*2)*(g.boss?(String(g.boss).startsWith('fin_')?1.6:1.3):1));
const durOf=(g,m)=>!g?0:noDur(g)?9999:(m&&m.d!=null?Math.min(m.d,maxDur(g)):maxDur(g));
const ok=(g,sl)=>g&&durOf(g,gmOf(sl))>0;
const gmOf=sl=>{const p=S.p;p.gm=p.gm||{};return p.gm[sl]=p.gm[sl]||{e:0,aw:0};};
const enhAtk=(g,e)=>e&&g&&g.atk?Math.round(g.atk*.12*e)+e:0,enhDef=(g,e)=>e&&g&&g.def?Math.round(g.def*.12*e)+Math.ceil(e/2):0;
const durTxt=(g,m)=>{if(noDur(g))return ' · 내구도 없음';const d=durOf(g,m),mx=maxDur(g);return d<=0?' · <b style="color:#ff6a5a">망가짐 (수리 필요)</b>':` · 내구도 ${d}/${mx}`;};
const gname=(k,m)=>GEAR[k].name+(m&&m.e?` +${m.e}`:'')+(m&&m.aw?' (각성)':'');
const atk=()=>{const g=wG(),p=S.p;let v=p.atk+(ok(g,'w')?g.atk+enhAtk(g,gmOf('w').e):0);if(buff('str'))v*=1.3;v*=tierMul();if(p.job2==='berserker'){v*=1.25;if(p.hp<=p.maxhp*.3)v*=1.5;}return Math.round(v);};
const def=()=>{const g=aG(),w=wG(),sh=sG(),cl=cG(),v=S.p.def+(ok(g,'a')?g.def+enhDef(g,gmOf('a').e):0)+(ok(cl,'c')?cl.def+enhDef(cl,gmOf('c').e):0)+(ok(w,'w')?(w.def||0):0)+(ok(sh,'s')?sh.def+enhDef(sh,gmOf('s').e):0);return Math.round(v*tierMul()*(S.p.job==='guardian'?1.2:1)*(S.p.job2==='paladin'?1.3:S.p.job2==='ironwall'?1.5:1));};
const guardCdMs=()=>{const sh=sG();return Math.max(900,Math.round((sh?sh.cd:2000)*(S.p.job==='guardian'?.75:1)*(S.p.job2==='ironwall'?.85:1)));};

  if(!es.length)return null;const av=f=>es.reduce((a,e)=>a+f(e),0)/es.length;return BAL_C[key]={atk:Math.max(1,av(e=>e.atk)),def:Math.max(1,av(e=>e.def)),hp:Math.max(1,av(e=>e.hp))};}
function balance(e,E){const b=MON[e.type];if(!b||b.fixed)return e;const dk=BAL_DK,pv=balPrev(dk,E);if(!pv)return e;const R=balRef(pv,E);if(!R)return e;
  let pool=BAL_POOL,fl=.5;if(dk&&DUNS[dk]){const D=DUNS[dk],f=E-D.eff(0);if(f>=1&&f<=(D.floors||27)){fl=(f-1)/Math.max(1,(D.floors||27)-1);pool=D.pool||POOL[D.theme(f)];}}

/* ---------- visibility ---------- */
function computeVis(){
  const m=S.map;S.vis=new Set();if(!m.dungeon)return;
  const p=S.p,R=7;
  for(let y=p.y-R;y<=p.y+R;y++)for(let x=p.x-R;x<=p.x+R;x++){
    if(x<0||y<0||x>=m.w||y>=m.h)continue;
    const dx=x-p.x,dy=y-p.y;if(dx*dx+dy*dy>R*R+1)continue;
    if(los(p.x,p.y,x,y)){S.vis.add(y*m.w+x);m.seen[y*m.w+x]=1;}
  }
}
function los(x0,y0,x1,y1){const m=S.map,n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));
  for(let i=1;i<n;i++){const x=Math.round(x0+(x1-x0)*i/n),y=Math.round(y0+(y1-y0)*i/n);if(m.grid[y][x]==='#'||m.grid[y][x]==='o')return false;}return true;}
const visible=(x,y)=>!S.map.dungeon||S.vis.has(y*S.map.w+x);

/* ---------- effects ---------- */
function part(x,y,vx,vy,c,life,gr=0,s=1){S.parts.push({x,y,vx,vy,c,life,max:life,gr,s});}
function burst(x,y,c,n,dx=0,dy=0,spd=1.4){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*spd;part(x,y,Math.cos(a)*v+dx*1.2,Math.sin(a)*v+dy*1.2-0.6,c,300+Math.random()*350,.08,Math.random()<.3?2:1);}}
function dissolve(e){
  const sp=SP[e.spr],W=sp.W,H=sp.H,bx=e.x*TS-(W-16)/2,by=e.y*TS-(H-16);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const ch=sp.grid[y][x];if(ch==='.'||!sp.pal[ch]||Math.random()<.35)continue;
    const vx=(x-W/2)/W*1.6+(Math.random()-.5)*.8,vy=-Math.random()*1.4-(H-y)/H*.4;
    part(bx+x,by+y,vx,vy,sp.pal[ch],450+Math.random()*500,.06);}
}
function fx(x,y,text,color,big){S.fx.push({x,y,text,color,big,born:performance.now()});}
function dust(x,y){const c=S.map.dungeon?'#5a5048':'#a89470';for(let i=0;i<3;i++)part(x*TS+6+Math.random()*4,y*TS+15,(Math.random()-.5)*.6,-Math.random()*.4,c,260+Math.random()*120,0,1);}

/* ---------- turns ---------- */
let lastMove=0,lastAtk=0;
const stoneAt=(x,y)=>(S.map.stones||[]).find(o=>o.x===x&&o.y===y);
function interTarget(x,y,porter){const m=S.map;if(!m)return null;
  const npc=m.npcs.find(n=>n.x===x&&n.y===y);if(npc)return {kind:'npc',npc,x,y,label:'대화하기',tall:true};
  const st=stoneAt(x,y);if(st)return {kind:'stone',st,x,y,label:'이동석'};
  if(tile(x,y)==='E')return {kind:'gate',x,y,label:'들어가기'};
  if(porter){const pa=(S.allies||[]).find(a=>a.porter&&a.x===x&&a.y===y);if(pa)return {kind:'porter',a:pa,x,y,label:'짐 열기'};}
  return null;}
function findInteract(){const p=S.p;if(!S.map)return null;const [dx,dy]=p.dir||[1,0];
  // people, stones, gates and stairs always win; the porter golem only answers when you face it and nothing else is there
  let t=interTarget(p.x+dx,p.y+dy);if(t)return t;
  for(const [ax,ay] of [[1,0],[-1,0],[0,1],[0,-1]]){t=interTarget(p.x+ax,p.y+ay);if(t)return {...t,dir:[ax,ay]};}
  const ch=tile(p.x,p.y);if(ch==='>'||ch==='<')return {kind:'stairs',ch,x:p.x,y:p.y,label:ch==='>'?'내려가기':'올라가기'};
  t=interTarget(p.x+dx,p.y+dy,true);if(t)return t;
  return null;}

for(const K of KQ){const D=DUNS[K.dun];const pool=[...new Set((D.pool||POOL[D.theme(K.floor)]||[]))].filter(k=>MON[k]&&!MON[k].boss);const mob=pool[0],lk=MON[K.look]?K.look:D.bossType(9);K.mob=mob;
  MON['kq_'+K.realm]={...MON[mob],name:K.ename,spr:(MON[lk]||MON[mob]).spr,boss:0,final:0,base:null};
  QUESTS.push({id:K.id,giver:K.giver,title:`왕국 이야기 · ${K.title}`,type:'kill',t:['kq_'+K.realm],n:1,exp:0,gold:0,story:K,ask:'',
    req:()=>K.realm==='arven'?S.stage>=5:!!(S.flags['gate_'+K.town]||(S.flags.ws||{})[K.town])});}
function kqSpawn(f,dun){for(const K of KQ){const st=QS()[K.id];if(!st||st.c>=1||K.dun!==dun||K.floor!==f)continue;if(S.ents.some(e=>e.type==='kq_'+K.realm))continue;
  const m=S.map,p=S.p;let pt=null;for(let t=0;t<400&&!pt;t++){const x=1+rnd(m.w-2),y=1+rnd(m.h-2);if(free(x,y)&&Math.abs(x-p.x)+Math.abs(y-p.y)>10)pt=[x,y];}if(!pt)continue;
  const e=mkEnemy(K.mob,pt[0],pt[1],DUNS[dun].eff(f));e.type='kq_'+K.realm;e.name=K.ename;e.spr=MON['kq_'+K.realm].spr;e.hp=e.maxhp=e.hp*7;e.atk=Math.round(e.atk*1.3);e.def=Math.round(e.def*1.15);e.exp*=12;e.gold*=12;e.elite=1;S.ents.push(e);
  setTimeout(()=>{toast('정예의 기척',`${K.ename}이(가) 이 층 어딘가에 있다`,true);log(`왕국 이야기 · ${K.ename}의 기척이 느껴진다.`);},600);}}
function kqFinish(q){const K=q.story;delete QS()[q.id];QD()[q.id]=(QD()[q.id]||0)+1;closePanel();
  say(K.climax,()=>panel(`<p class="eyebrow">왕국 이야기 · ${REALM_KO[K.realm]||''}</p><h2>${K.title}</h2><p>${K.q}</p><div class="list">${K.opts.map((o,i)=>`<div class="item"><div><b>${o.label}</b></div><button class="${i?'':'primary'}" data-act="kqpick" data-arg="${q.id}:${i}">선택</button></div>`).join('')}</div>`,false));}
function kqPick(a){if(performance.now()-(S.panelT||0)<700)return;const [id,i]=a.split(':'),K=(QUESTS.find(x=>x.id===id)||{}).story;if(!K)return;const o=K.opts[+i],p=S.p;closePanel();
  S.flags.kqc=S.flags.kqc||{};S.flags.kqc[id]=+i;const ex=Math.round(need(p.lv)*.6),gd=Math.round(DUNS[K.dun].eff(K.floor)*DUNS[K.dun].eff(K.floor)*4*(o.gold||1));
  say(o.lines,()=>{p.exp+=ex;p.gold+=gd;const got=[`경험치 ${ex}`,`${gd}G`];for(const [k,n] of (o.items||[])){giveItem(k,n,itemOf(k).name);got.push(`${itemOf(k).name} ${n}개`);}
    if(o.ember){S.flags.bwSet=S.flags.bwSet||{};S.flags.bwSet.ember=1;log(BW_MSG(bwCount()));}
    S.flashW=.5;const X=W8(p.x),Y=W8(p.y);vPillar(X,Y,120,'#ffd36b',1200,10);vWave(X,Y,60,'#ffd36b',900,0);vBurst(X,Y,['#ffd36b','#ffffff','#ff9a3a'],80,3.4,1100);AU.sx('lvl');
    toast(`${REALM_KO[K.realm]} 이야기 완료`,K.title,true);log(`왕국 이야기 완료 · ${got.join(' · ')}`);checkLevel();save();hud();});}

function keeperSpot(id){if(id in VPOS)return VPOS[id];const T=TOWNS[id];if(!T)return VPOS[id]=null;const g=T.rows,H=g.length,W=g[0].length;let base=[];try{base=T.npcs.__orig?T.npcs.__orig():[];}catch(e){}
  const taken=new Set(base.map(n=>n.x+','+n.y).concat((T.stones||[]).map(o=>o.x+','+o.y)));
  const walk=(x,y)=>x>0&&y>0&&x<W-1&&y<H-1&&!SOLID.has(g[y][x])&&!/[A-Z]/.test(g[y][x]);
  const inn=base.find(n=>/openInn/.test(String(n.talk)))||base[0]||{x:W>>1,y:H>>1};
  for(let r=1;r<=8;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const x=inn.x+dx,y=inn.y+dy;
    if(!walk(x,y)||g[y][x]==='='||taken.has(x+','+y))continue;const nb=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>walk(x+a,y+b)).length;if(nb<4)continue;
    if([[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>taken.has((x+a)+','+(y+b))))continue;return VPOS[id]=[x,y];}
  return VPOS[id]=null;}

function vPut(list,size,s){const st=stackOf(s.k);let n=s.n||1;if(st>1)for(let i=0;i<size&&n>0;i++){const t=list[i];if(t&&t.k===s.k&&t.n<st){const a=Math.min(n,st-t.n);t.n+=a;n-=a;}}

function aiTick(now){

  if(now-lastAi>250){for(const e of S.ents)e.next=Math.max(e.next,now+250+Math.random()*350);lastRegen=now;}
  lastAi=now;

    if(e.boss&&!m.bossIntro){e.next=now+300;continue;}

    const dx=p.x-e.x,dy=p.y-e.y,d=Math.abs(dx)+Math.abs(dy),seen=visible(e.x,e.y);
    if(!e.aware&&seen&&d<=8)e.aware=true;

    if(!e.ranged&&S.allies.length){const al=S.allies.find(a=>Math.abs(a.x-e.x)+Math.abs(a.y-e.y)===1);if(al&&(e.aware||Math.random()<.5)){e.aware=true;e.next=now+e.spd*jitter;hitAlly(e,al);continue;}}

      if(aligned&&d>=1){e.next=now+e.spd*1.5*jitter;fireEnemy(e,Math.sign(dx),Math.sign(dy));continue;}
      if(d<=2){const away=[[-Math.sign(dx),0],[0,-Math.sign(dy)],[0,1],[0,-1],[1,0],[-1,0]].filter(c=>c[0]||c[1]);

        e.next=now+e.spd*jitter;continue;}

  }

addEventListener('keydown',e=>{
  const k=e.key,nk=normKey(k);
  if(S.cmdOpen)return;
  if(e.target&&(e.target.tagName==='TEXTAREA'||(e.target.tagName==='INPUT'&&e.target.type!=='range')))return;
  if((k==='Enter'||e.code==='Enter'||e.code==='NumpadEnter')&&(e.ctrlKey||e.metaKey)&&S.mode==='play'&&!e.repeat){e.preventDefault();openCmd();return;}
  if(S.rebind){e.preventDefault();const rb=S.rebind;
    if(k==='Escape'){S.rebind=null;openKeys();return;}
    if(k==='Backspace'||k==='Delete'){KEYS[rb.act][rb.i]='';S.rebind=null;saveKeys();openKeys();return;}
    if(/^[1-9]$/.test(k)){log('숫자 1~9는 아이템 칸 전용이에요.');return;}
    if(['Shift','Control','Alt','Meta','Tab','Enter'].includes(k))return;
    KEYS[rb.act][rb.i]=nk;S.rebind=null;saveKeys();openKeys();return;}
  const act=actionOf(k);
  if(S.cine){if(S.cine.done&&['Enter',' ','f','F','Escape'].includes(k)){e.preventDefault();S.cine.done();}return;}
  if(S.mode==='dlg'){if(act==='interact'||k==='Enter'){e.preventDefault();if(!e.repeat)advance();}else if(k.startsWith('Arrow')||k===' ')e.preventDefault();return;}
  if(S.mode==='panel'){
    if((k==='Escape'&&S.closable)||(act==='bag'&&S.bag&&!e.repeat)||(act==='quest'&&S.qwin&&!e.repeat)){e.preventDefault();closePanel();return;}
    if(S.bag&&/^[1-9]$/.test(k)&&S.p.inv[S.invSel]&&USE[S.p.inv[S.invSel].k]){e.preventDefault();ACT.hotset(+k-1);return;}
    const btns=[...$('panel').querySelectorAll('button:not(:disabled)')];
    if(act==='up'||act==='down'){e.preventDefault();let i=btns.indexOf(document.activeElement);i=(i+(act==='down'?1:-1)+btns.length)%btns.length;btns[i]&&btns[i].focus();return;}
    if(act==='interact'&&k!==' '&&!e.repeat){const c=$('panel').querySelector('[data-act="close"]');if(c){e.preventDefault();c.click();}}
    return;}
  if(S.mode!=='play')return;
  if(/^[1-9]$/.test(k)){if(!e.repeat)useHot(+k-1);return;}
  if(e.code&&/^Numpad[1-9]$/.test(e.code)){if(!e.repeat)useHot(+e.code.slice(6)-1);return;}
  const acts=actionsOf(k);if(!acts.length)return;e.preventDefault();
  for(const act of acts){if(S.mode!=='play'&&act!=='guard'&&act!=='attack')break;
  if(ADIR[act]){if(!held.includes(act)){held.push(act);tryMove(ADIR[act][0],ADIR[act][1]);}continue;}
  if(act==='bag'&&!e.repeat)openBag();
  else if(act==='quest'&&!e.repeat)openQuestLog();
  else if(act==='attack'){if(!atkHeld){atkHeld=true;attackAction();}}
  else if(act==='interact'&&!e.repeat)interactAction();
  else if(act==='skill'&&!e.repeat)skillAction(1);
  else if(act==='skill2'&&!e.repeat)skillAction(2);
  else if(act==='skill3'&&!e.repeat)skillAction(3);
  else if(act==='ult'&&!e.repeat)skillAction(4);
  else if(act==='awaken'&&!e.repeat)awakenAction('w');
  else if(act==='awaken2'&&!e.repeat)awakenAction('a');
  else if(act==='awaken3'&&!e.repeat)awakenAction('c');
  else if(act==='awaken4'&&!e.repeat)awakenAction('s');
  else if(act==='guard')setGuard(true);}
});

  const req=el.requestFullscreen||el.webkitRequestFullscreen;

  try{await req.call(el,{navigationUI:'hide'});}catch(e){toast('전체화면 실패','브라우저에서 직접 열어 주세요');return;}
  try{await screen.orientation.lock('landscape');}catch(e){}
  setTimeout(onResize,300);});
const fsSync=()=>{$('mFull').textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'창 모드':'전체화면';};
document.addEventListener('fullscreenchange',fsSync);document.addEventListener('webkitfullscreenchange',fsSync);

/* ---------- boot ---------- */
try{uniqPass();}catch(e){console.error(e);}
function start(data){
  updateKeyHint();
  requestAnimationFrame(frame);
  if(data&&data.save){applySnap(data.save);loadTown('village',18,14);S.mode='play';log('모험을 이어간다.');return;}
  title();hud();
}
window.claude?.hot?.snapshot?.(()=>S.mode==='title'?{}:{save:snap()});
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
